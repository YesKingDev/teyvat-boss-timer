<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised Teyvat night sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="0.42" stop-color="#0b1326"/>
      <stop offset="0.75" stop-color="#122138"/>
      <stop offset="1" stop-color="#17293f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1dca8" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#e8c878" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8c878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f7ba3" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#22506e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22506e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="auroraCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52b7e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#52b7e8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#52b7e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c878" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8c878" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8c878" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurWide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.85">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#01030a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dfe8ff">
    <circle cx="120" cy="140" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="340" cy="210" r="1.4" opacity="0.65"/>
    <circle cx="452" cy="64" r="1.8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="170" r="1.2" opacity="0.55"/>
    <circle cx="640" cy="110" r="1.6" opacity="0.75"/>
    <circle cx="720" cy="250" r="1.1" opacity="0.45"/>
    <circle cx="810" cy="80" r="1.4" opacity="0.7"/>
    <circle cx="905" cy="190" r="1.7" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="1090" cy="240" r="1.5" opacity="0.7"/>
    <circle cx="1180" cy="70" r="1.2" opacity="0.55"/>
    <circle cx="1270" cy="160" r="1.6" opacity="0.8"/>
    <circle cx="1360" cy="100" r="1.1" opacity="0.45"/>
    <circle cx="1450" cy="330" r="1.3" opacity="0.6"/>
    <circle cx="1560" cy="90" r="1.7" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.1s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1660" cy="200" r="1.2" opacity="0.55"/>
    <circle cx="1760" cy="130" r="1.5" opacity="0.75"/>
    <circle cx="1850" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="90" cy="320" r="1.3" opacity="0.6"/>
    <circle cx="200" cy="420" r="1.1" opacity="0.45"/>
    <circle cx="310" cy="360" r="1.5" opacity="0.7"/>
    <circle cx="430" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="400" r="1.6" opacity="0.75"/>
    <circle cx="680" cy="350" r="1.1" opacity="0.45"/>
    <circle cx="790" cy="430" r="1.4" opacity="0.65"/>
    <circle cx="920" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="1040" cy="450" r="1.5" opacity="0.7"/>
    <circle cx="1150" cy="380" r="1.1" opacity="0.4"/>
    <circle cx="1260" cy="440" r="1.4" opacity="0.6"/>
    <circle cx="1390" cy="480" r="1.2" opacity="0.5"/>
    <circle cx="1520" cy="430" r="1.4" opacity="0.65"/>
    <circle cx="1650" cy="500" r="1.1" opacity="0.45"/>
    <circle cx="1790" cy="420" r="1.5" opacity="0.7"/>
    <circle cx="1870" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="150" cy="540" r="1.2" opacity="0.5"/>
    <circle cx="270" cy="600" r="1.4" opacity="0.6"/>
    <circle cx="390" cy="520" r="1.1" opacity="0.4"/>
    <circle cx="500" cy="640" r="1.3" opacity="0.55"/>
    <circle cx="620" cy="560" r="1.2" opacity="0.45"/>
    <circle cx="750" cy="620" r="1.4" opacity="0.6"/>
    <circle cx="880" cy="550" r="1.1" opacity="0.4"/>
    <circle cx="1010" cy="610" r="1.3" opacity="0.55"/>
    <circle cx="1140" cy="540" r="1.2" opacity="0.45"/>
  </g>

  <!-- moon -->
  <ellipse cx="1480" cy="255" rx="430" ry="430" fill="url(#moonGlow)"/>
  <circle cx="1480" cy="255" r="58" fill="#f4e9c8"/>
  <circle cx="1462" cy="242" r="12" fill="#e4d5a8" opacity="0.7"/>
  <circle cx="1500" cy="272" r="8" fill="#e4d5a8" opacity="0.55"/>
  <circle cx="1478" cy="284" r="5" fill="#e4d5a8" opacity="0.5"/>

  <!-- aurora ribbons -->
  <path d="M-120,430 C320,330 640,470 1040,392 C1390,326 1690,382 2040,296 L2040,196 C1680,286 1360,222 1010,290 C620,366 300,238 -120,318 Z" fill="url(#auroraCyan)" filter="url(#blurWide)" opacity="0.5"/>
  <path d="M-120,540 C360,460 700,560 1120,486 C1440,428 1740,472 2040,404 L2040,332 C1720,398 1420,352 1080,420 C680,498 340,392 -120,468 Z" fill="url(#auroraGold)" filter="url(#blurWide)" opacity="0.55"/>

  <!-- clouds -->
  <g filter="url(#blurSoft)">
    <ellipse cx="420" cy="640" rx="280" ry="46" fill="#9fb4d8" opacity="0.08"/>
    <ellipse cx="1240" cy="540" rx="330" ry="54" fill="#9fb4d8" opacity="0.07"/>
    <ellipse cx="900" cy="780" rx="520" ry="62" fill="#7d92b8" opacity="0.06"/>
    <ellipse cx="1650" cy="700" rx="260" ry="42" fill="#8fa5c9" opacity="0.06"/>
  </g>

  <!-- horizon glow -->
  <ellipse cx="960" cy="1160" rx="1350" ry="430" fill="url(#horizonGlow)"/>

  <!-- mountains: far -->
  <path d="M0,940 L140,800 L300,905 L470,745 L640,880 L820,755 L1000,885 L1180,720 L1360,860 L1540,760 L1720,880 L1920,790 L1920,1200 L0,1200 Z" fill="#141f36" opacity="0.9"/>
  <!-- mountains: mid -->
  <path d="M0,1030 L190,890 L370,1000 L560,855 L750,985 L950,865 L1140,995 L1330,845 L1530,975 L1730,880 L1920,970 L1920,1200 L0,1200 Z" fill="#0c1626"/>
  <!-- mountains: near -->
  <path d="M0,1120 L230,990 L430,1090 L640,960 L860,1080 L1080,950 L1300,1075 L1520,955 L1740,1070 L1920,985 L1920,1200 L0,1200 Z" fill="#060b15"/>
  <!-- faint snow rims on far peaks -->
  <g stroke="#c8d8f0" stroke-opacity="0.14" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M440,772 L470,745 L502,768"/>
    <path d="M1148,748 L1180,720 L1214,750"/>
    <path d="M1510,786 L1540,760 L1572,788"/>
  </g>

  <!-- floating sparkles -->
  <g>
    <circle cx="300" cy="760" r="2.6" fill="#e8c878" opacity="0.55">
      <animate attributeName="cy" values="760;700;760" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="820" r="2" fill="#9ed2e4" opacity="0.5">
      <animate attributeName="cy" values="820;760;820" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="740" r="2.8" fill="#e8c878" opacity="0.5">
      <animate attributeName="cy" values="740;672;740" dur="16s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="16s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1330" cy="800" r="1.8" fill="#a98fd6" opacity="0.45">
      <animate attributeName="cy" values="800;748;800" dur="12s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="12s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1620" cy="730" r="2.2" fill="#9ed2e4" opacity="0.5">
      <animate attributeName="cy" values="730;676;730" dur="14s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="14s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="880" r="1.8" fill="#e8c878" opacity="0.4">
      <animate attributeName="cy" values="880;836;880" dur="10s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="10s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="905" r="2" fill="#a98fd6" opacity="0.4">
      <animate attributeName="cy" values="905;856;905" dur="15s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.08;0.4" dur="15s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1780" cy="860" r="1.8" fill="#9cc94b" opacity="0.35">
      <animate attributeName="cy" values="860;812;860" dur="12s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="12s" begin="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1920" height="1200" fill="url(#vignette)"/>
</svg>
