<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Goldflame Qucusaur Tyrant artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#e8823f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e8823f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca8"/>
      <stop offset="1" stop-color="#c9a85c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#hatch)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g transform="translate(400 238)">
    <rect x="-98" y="-98" width="196" height="196" transform="rotate(45)" fill="#e8823f" opacity="0.09"/>
    <rect x="-98" y="-98" width="196" height="196" transform="rotate(45)" fill="none" stroke="url(#gold)" stroke-opacity="0.85" stroke-width="2.5"/>
    <rect x="-80" y="-80" width="160" height="160" transform="rotate(45)" fill="none" stroke="#e8823f" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <text x="400" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" letter-spacing="10" fill="url(#gold)">GQ</text>
  <text x="400" y="356" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="12" fill="#e8823f" fill-opacity="0.85">PYRO</text>
  <rect width="800" height="500" fill="url(#vignette)"/>
</svg>
